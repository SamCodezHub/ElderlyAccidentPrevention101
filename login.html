<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0e0e1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(140px);
            opacity: 0.12;
            pointer-events: none;
        }

        .g1 { top: -200px; left: -100px; width: 500px; height: 500px; background: #6c5ce7; }
        .g2 { bottom: -200px; right: -100px; width: 400px; height: 400px; background: #00cec9; }

        .card {
            position: relative;
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.06);
            padding: 48px 40px;
            width: 360px;
            z-index: 1;
        }

        .bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, #6c5ce7, #00cec9);
        }

        h1 { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 4px; }
        .sub { font-size: 13px; color: rgba(255,255,255,0.3); margin-bottom: 36px; }

        .field { margin-bottom: 18px; }

        .field label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: rgba(255,255,255,0.35);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .field input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.04);
            color: #fff;
            font-size: 14px;
            transition: all 0.3s;
        }

        .field input::placeholder { color: rgba(255,255,255,0.18); }

        .field input:focus {
            outline: none;
            border-color: #6c5ce7;
            background: rgba(108,92,231,0.06);
        }

        .submit {
            width: 100%;
            padding: 13px;
            border: none;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
        }

        .submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(108,92,231,0.35);
        }

        .msg {
            padding: 10px 14px;
            font-size: 13px;
            margin-bottom: 18px;
            display: none;
            border-left: 3px solid #fd79a8;
            background: rgba(253,121,168,0.08);
            color: #fd79a8;
        }

        .msg.show { display: block; }
    </style>
</head>
<body>
    <div class="glow g1"></div>
    <div class="glow g2"></div>

    <div class="card">
        <div class="bar"></div>
        <h1>Moderator Login</h1>
        <p class="sub">Elderly Accident Prevention System</p>

        <div id="msg" class="msg"></div>

        <form id="form">
            <div class="field">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username" required>
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="submit">Sign in</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('form');
        const msg = document.getElementById('msg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const result = await window.electronAPI.login({ username, password });
                if (result.success && result.user.role === 'moderator') {
                    sessionStorage.setItem('currentUser', JSON.stringify(result.user));
                    window.location.href = 'dashboard.html';
                } else if (result.success) {
                    msg.textContent = 'Moderator access only';
                    msg.className = 'msg show';
                } else {
                    msg.textContent = result.message;
                    msg.className = 'msg show';
                }
            } catch (err) {
                msg.textContent = 'Something went wrong';
                msg.className = 'msg show';
            }
        });
    </script>
</body>
</html>
